services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fat
      POSTGRES_PASSWORD: fat
      POSTGRES_DB: fat_controller
    ports:
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fat -d fat_controller"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
